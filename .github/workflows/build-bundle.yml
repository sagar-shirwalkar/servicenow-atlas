# Smoke test only. The bundle is built locally on Apple Silicon (or any
# machine with MLX/CUDA) and published via scripts/publish-bundle.sh.
# This workflow:
#   - Runs atlas-smoke on every push to main that touches atlas/ source.
#   - Runs atlas-smoke monthly to catch regressions in the docs source.
#   - Accepts manual dispatch (for one-off smoke runs).
#
# To publish a release:
#   1. uv sync
#   2. ./scripts/publish-bundle.sh <owner>/<repo>
#
# See "Publishing a release" in the README for details.

name: build-bundle

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"
  push:
    branches: [main]
    paths:
      - "atlas/**"
      - "pyproject.toml"
      - ".github/workflows/build-bundle.yml"

env:
  DOCS_DIR: data/servicenow-docs/ServiceNowDocs-australia

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Clone ServiceNow docs
        run: |
          git clone --depth 1 -b australia \
            https://github.com/ServiceNow/ServiceNowDocs.git \
            "$DOCS_DIR"

      - name: Smoke test
        run: |
          uv run atlas-smoke
          echo "Smoke test passed. To publish a release, run:"
          echo "  ./scripts/publish-bundle.sh \${{ github.repository }}"
